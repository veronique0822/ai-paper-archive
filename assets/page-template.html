<!doctype html>
<!-- 内容页模板（日报/周报/科普共用，AI Paper Scout 风格）。复制到目标目录后替换 {{...}} 占位符。 -->
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{TITLE}} · AI 论文猎手档案馆</title>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回档案馆主页</a>
  <div class="kicker" style="margin-top:26px">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{DATE}} ｜ 本期 {{COUNT}} 条</div>
  <div class="trend">{{LEAD_HTML}}</div>
  <h2>本期条目</h2>
  <!-- 每个条目按此结构排列 -->
  <div class="paper">
    <div class="meta">{{ORG}} · {{PUBLISH_DATE}}</div>
    <a class="ptitle" href="{{PAPER_URL}}">{{PAPER_TITLE}}</a>
    <p><b>一句话：</b>{{ONE_LINE}}</p>
    <p><b>为什么值得看：</b>{{WHY_IT_MATTERS}}</p>
    <div class="chips">{{TAGS}}{{COMPANIES}}<span class="chip cg">难度：{{LEVEL}}</span></div>
  </div>
  <div class="end"><div class="t">收录信息</div><p>{{SNAPSHOT}}</p></div>
  <div class="foot">AI 论文猎手 · 个人学习档案馆 · 由定时任务自动维护</div>
</div>
</body></html>
