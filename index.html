<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI 论文猎手 · 个人学习档案馆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#fff;color:#1a1a1a;line-height:1.9}
.wrap{max-width:680px;margin:0 auto;padding:56px 22px 80px}
.kicker{font-size:13px;letter-spacing:.18em;color:#b0b0b0;margin-bottom:14px;font-weight:600}
h1{font-size:30px;line-height:1.4;letter-spacing:-.01em;margin-bottom:8px}
h2{font-size:19px;margin:38px 0 16px;padding-left:12px;border-left:4px solid #ff5a1f}
.sub{font-size:14px;color:#999;margin-bottom:30px}
.trend{background:#1a1a1a;color:#fff;border-radius:16px;padding:24px 26px;margin-bottom:36px;font-size:15px}
.trend b{color:#ffb020}
.trend div{margin:4px 0}
.stats{display:flex;gap:12px;margin-bottom:36px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;border:1.5px solid #eee;border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:#1a1a1a}
.stat .n{font-size:26px;font-weight:800}
.stat .l{font-size:12px;color:#999}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.inp{flex:1;min-width:180px;border:1.5px solid #eee;border-radius:12px;padding:9px 14px;font-size:14px;font-family:inherit;color:#1a1a1a}
.inp:focus{outline:none;border-color:#ff5a1f}
.fbtn{border:1.2px solid #ddd;background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;color:#666}
.fbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.paper{padding:14px 0;border-bottom:1px dashed #e8e8e8}
.paper:last-child{border-bottom:none}
.ptitle{font-weight:600;font-size:15px;color:#1a1a1a;text-decoration:none;border-bottom:1px solid #ffb020}
.ptitle:hover{color:#ff5a1f}
.meta{font-size:12px;color:#999;margin:4px 0}
.paper p{font-size:13.5px;color:#444}
.chips{margin-top:6px}
.chip{display:inline-block;font-size:11.5px;padding:1px 10px;border-radius:999px;margin-right:6px;margin-top:4px;border:1.2px solid}
.c1{border-color:#ff5a1f;color:#ff5a1f}
.c2{border-color:#d93a3a;color:#d93a3a}
.c3{border-color:#2b6cb0;color:#2b6cb0}
.cg{border-color:#bbb;color:#888}
.end{background:#1a1a1a;color:#fff;border-radius:16px;padding:24px 26px;margin-top:40px}
.end .t{color:#ffb020;font-weight:700;margin-bottom:10px;font-size:15px}
.end p{font-size:13.5px;color:#ccc;margin-bottom:12px}
.end p:last-child{margin-bottom:0}
.snap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f7f7f7;border:1px solid #eee;border-radius:12px;padding:16px 18px;white-space:pre-wrap;color:#555;line-height:1.7;margin-top:24px}
.foot{font-size:12px;color:#bbb;margin-top:28px;line-height:1.7}
.empty{border:1px dashed #e0e0e0;border-radius:14px;padding:44px 20px;text-align:center;color:#999;font-size:14px;margin:10px 0}
.back{font-size:13px;color:#999;text-decoration:none;border-bottom:1px solid #ffb020}
.back:hover{color:#ff5a1f}
</style></head>
<body>
<div class="wrap">
  <div class="kicker">AI PAPER SCOUT · PERSONAL ARCHIVE</div>
  <h1>AI 论文猎手 · 档案馆</h1>
  <div class="sub">每日晨检 · 每周精选 · 零基础科普 ｜ 长期学习沉淀，全部可回溯</div>
  <div class="trend"><div>📌 这是你的<b>固定入口</b>：每周一 09:00 精选周报、周二至周六 09:00 晨检日报自动更新并归档到这里。</div><div>🔍 用下方搜索或药丸按钮筛选，点任意条目进入<b>完整版</b>（含入选理由与标签）。</div></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input class="inp" id="q" placeholder="搜索标题、摘要、标签、公司…"/>
    <button class="fbtn on" data-t="all" onclick="setT('all')">全部</button>
    <button class="fbtn" data-t="week" onclick="setT('week')">周报</button>
    <button class="fbtn" data-t="day" onclick="setT('day')">日报</button>
    <button class="fbtn" data-t="learn" onclick="setT('learn')">科普</button>
  </div>
  <h2>内容时间线</h2>
  <div id="list"></div>
  <div class="foot">由「AI论文猎手」定时任务自动维护 · 每周一 09:00 精选 / 周二至周六 09:00 晨检 · <a href="https://github.com/veronique0822/ai-paper-archive" style="color:#bbb">GitHub 仓库</a></div>
</div>
<script src="data.js"></script>
<script>
const TL={week:'周报',day:'日报',learn:'科普'};
let cur='all';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setT(t){cur=t;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
function render(){
  const E=(window.ARCHIVE_DATA&&window.ARCHIVE_DATA.entries)||[];
  const q=document.getElementById('q').value.trim().toLowerCase();
  const show=E.filter(e=>(cur==='all'||e.type===cur)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));
  const c={week:0,day:0,learn:0};E.forEach(e=>c[e.type]=(c[e.type]||0)+1);
  const stat=(label,val,sub,t)=>`<div class="stat" onclick="setT('${t}')"><div class="n">${val}</div><div class="l">${label} · ${sub}</div></div>`;
  document.getElementById('stats').innerHTML=stat('期内容',E.length,'全部','all')+stat('周报',c.week||0,'每周一','week')+stat('日报',c.day||0,'周二至周六','day')+stat('科普',c.learn||0,'随周报','learn');
  const list=document.getElementById('list');
  if(!show.length){list.innerHTML='<div class="empty">档案馆虚位以待 —— 第一期内容将在下一次定时任务运行时自动生成。</div>';return;}
  list.innerHTML=show.map(e=>`<div class="paper">
    <div class="meta"><span class="chip c1">${TL[e.type]}</span> ${esc(e.date)} · ${e.count||0} 条</div>
    <a class="ptitle" href="${esc(e.url)}">${esc(e.title)}</a>
    <p>${esc(e.summary||'')}</p>
    <div class="chips">${(e.tags||[]).map(t=>`<span class="chip c3">#${esc(t)}</span>`).join('')}{(e.companies||[]).map(t=>`<span class="chip c2">@${esc(t)}</span>`).join('')}</div>
  </div>`).join('');
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body></html>
